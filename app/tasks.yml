version: "3"

vars:
  APP_NAME: Craftward
  SIGN_IDENTITY: '{{default "-" .SIGN_IDENTITY}}'
  BUILD_ROOT: '{{if hasPrefix "/" (default "" .BUILD_ROOT)}}{{.BUILD_ROOT}}{{else}}{{.TASKFILE_DIR}}/{{default "build" .BUILD_ROOT}}{{end}}'
  HOST_ARCH:
    sh: uname -m
  OTHER_ARCH: '{{if eq .HOST_ARCH "arm64"}}x86_64{{else}}arm64{{end}}'

tasks:
  prototype:inline:
    desc: Build and run the standalone inline renderer prototype
    requires:
      vars: [QT6_ROOT]
    vars:
      PROTOTYPE_DIR: '{{default "../.tmp/inline-renderer-prototype" .PROTOTYPE_DIR}}'
      PROTOTYPE_ARGS: '{{default "" .PROTOTYPE_ARGS}}'
    env:
      TMPDIR: "{{.TASKFILE_DIR}}/{{.PROTOTYPE_DIR}}/scratch"
      QML_DISABLE_DISK_CACHE: "1"
      CRAFTWARD_INLINE_PROTOTYPE_OUTPUT_DIR: "{{.TASKFILE_DIR}}/{{.PROTOTYPE_DIR}}/evidence"
    cmds:
      - 'mkdir -p "{{.PROTOTYPE_DIR}}/scratch"'
      - >-
        cmake -S src/ward/markup/prototype -B "{{.PROTOTYPE_DIR}}/build"
        -G Ninja -DCMAKE_BUILD_TYPE=Debug -DQt6_ROOT="$QT6_ROOT"
        -DCMAKE_CXX_COMPILER_LAUNCHER=
      - 'cmake --build "{{.PROTOTYPE_DIR}}/build" --parallel'
      - '"{{.PROTOTYPE_DIR}}/build/CraftwardInlinePrototype.app/Contents/MacOS/CraftwardInlinePrototype" {{.PROTOTYPE_ARGS}}'

  prototype:selection:
    desc: Build and run the standalone message selection experiment
    cmds:
      - task: prototype:inline
        vars:
          PROTOTYPE_DIR: "../.tmp/inline-selection-prototype"
          PROTOTYPE_ARGS: "--selection"

  clean:
    desc: Remove all application build artifacts
    cmds:
      - cmake -E remove_directory "{{.BUILD_ROOT}}"

  format:qml:
    desc: Format QML files
    internal: true
    requires:
      vars: [QT6_ROOT]
    preconditions:
      - sh: test -x "$QT6_ROOT/bin/qmlformat"
        msg: qmlformat was not found under QT6_ROOT
    cmds:
      - >-
        git ls-files -z
        --cached
        --others
        --exclude-standard
        --no-recurse-submodules
        --
        ":(glob)qml/**/*.qml"
        ":(glob)tests/**/*.qml"
        | xargs -0 sh -c
        'formatter=$1; shift; for path do test ! -f "$path" || "$formatter" -i "$path" || exit; done'
        sh "$QT6_ROOT/bin/qmlformat"

  test:
    desc: Run all application regression tests
    cmds:
      - task: test:qml
      - task: test:cpp

  test:qml:
    desc: Run QML regression tests
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      ARCH: '{{default .HOST_ARCH .ARCH}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}/{{.ARCH}}"
    requires:
      vars: [QT6_ROOT]
    deps:
      - task: configure
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          ARCH: "{{.ARCH}}"
          BUILD_TESTING: "ON"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    env:
      QT_QPA_PLATFORM: offscreen
    cmds:
      - 'cmake --build "{{.BUILD_DIR}}" --target CraftwardQmlTest release_translations --parallel'
      - >-
        "{{.BUILD_DIR}}/tests/qml/CraftwardQmlTest"
        -import tests/qml/imports
        -translation "{{.BUILD_DIR}}/craftward_en.qm"
        -input tests/qml

  test:cpp:
    desc: Build and run C++ regression tests
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      ARCH: '{{default .HOST_ARCH .ARCH}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}/{{.ARCH}}"
    deps:
      - task: :core:build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
      - task: configure
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          ARCH: "{{.ARCH}}"
          BUILD_TESTING: "ON"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - >-
        cmake --build "{{.BUILD_DIR}}"
        --target
        CraftwardApplicationControllerTest
        CraftwardWorkbenchFilesTest
        CraftwardCoreFfiSupportTest
        CraftwardCodexHistoryControllerTest
        CraftwardCodexTimelineModelTest
        CraftwardCodexTimelinePresentationModelTest
        CraftwardCodexTimelineViewportIntegrationTest
        CraftwardCodexTimelineViewportModelTest
        CraftwardLocalizationControllerTest
        CraftwardMarkupSemanticTest
        CraftwardRealmControllerTest
        CraftwardSyntaxHighlightingTest
        CraftwardTerminalCursorTest
        CraftwardTerminalFontTest
        CraftwardTerminalInputTest
        CraftwardTerminalIntegrationTest
        --parallel
      - >-
        ctest --test-dir "{{.BUILD_DIR}}"
        --output-on-failure
        -R '^Craftward(ApplicationController|WorkbenchFiles|CoreFfiSupport|CodexHistoryController|CodexTimelineModel|CodexTimelinePresentationModel|CodexTimelineViewportIntegration|CodexTimelineViewportModel|LocalizationController|MarkupSemantic|RealmController|SyntaxHighlighting|TerminalCursor|TerminalFont|TerminalInput|TerminalIntegration)Test([.].*)?$'

  configure:
    label: "app:configure:{{.BUILD_TYPE}}:{{.ARCH}}:testing={{.BUILD_TESTING}}"
    desc: Configure the application build
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      ARCH: '{{default .HOST_ARCH .ARCH}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}/{{.ARCH}}"
      BUILD_TESTING: '{{default "OFF" .BUILD_TESTING}}'
    requires:
      vars: [QT6_ROOT]
    deps:
      - task: :xtask:bindings:check
      - task: :xtask:version:check
      - task: :xtask:licenses:generate
        vars:
          OUTPUT_DIR: "{{.BUILD_DIR}}/generated/legal"
    env:
      CRAFTWARD_SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    preconditions:
      - sh: test "{{.ARCH}}" = "arm64" || test "{{.ARCH}}" = "x86_64"
        msg: ARCH must be arm64 or x86_64
    cmds:
      - >-
        cmake -S .
        -B "{{.BUILD_DIR}}"
        -G Ninja
        -DCMAKE_BUILD_TYPE="{{.BUILD_TYPE}}"
        -DCMAKE_OSX_ARCHITECTURES="{{.ARCH}}"
        -DCMAKE_OSX_DEPLOYMENT_TARGET="{{.MACOS_DEPLOYMENT_TARGET}}"
        -DBUILD_TESTING="{{.BUILD_TESTING}}"
        -DQt6_ROOT="$QT6_ROOT"
        -DCRAFTWARD_SIGN_IDENTITY="$CRAFTWARD_SIGN_IDENTITY"

  build:
    label: "app:build:{{.BUILD_TYPE}}"
    desc: Build the application
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}"
    env:
      CRAFTWARD_SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - task: build:arch
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          ARCH: "{{.HOST_ARCH}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
      - task: build:arch
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          ARCH: "{{.OTHER_ARCH}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
      - >-
        cmake
        -DARM64_BUNDLE="{{.BUILD_DIR}}/arm64/{{.APP_NAME}}.app"
        -DX86_64_BUNDLE="{{.BUILD_DIR}}/x86_64/{{.APP_NAME}}.app"
        -DOUTPUT_BUNDLE="{{.BUILD_DIR}}/{{.APP_NAME}}.app"
        -DENTITLEMENTS="{{.TASKFILE_DIR}}/macos/Entitlements.plist"
        -P macos/merge-universal.cmake

  build:arch:
    label: "app:build:{{.BUILD_TYPE}}:{{.ARCH}}"
    desc: Build one application architecture
    internal: true
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      ARCH: '{{default .HOST_ARCH .ARCH}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}/{{.ARCH}}"
    deps:
      - task: :core:build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
      - task: configure
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          ARCH: "{{.ARCH}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - cmake --build "{{.BUILD_DIR}}" --parallel

  run:
    label: "app:run:{{.BUILD_TYPE}}"
    desc: Run the application
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}"
    deps:
      - task: build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - '"{{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"'

  benchmark:timeline-render:
    label: "app:benchmark:timeline-render:{{.BUILD_TYPE}}"
    desc: Benchmark timeline rendering against a persisted Codex conversation
    vars:
      BUILD_TYPE: '{{default "Release" .BUILD_TYPE}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}"
    requires:
      vars: [QT6_ROOT, THREAD_ID]
    deps:
      - task: build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    env:
      CRAFTWARD_FRAME_TIMING_OVERLAY: "0"
      CRAFTWARD_TIMELINE_RENDER_BENCHMARK_THREAD: "{{.THREAD_ID}}"
      QT_MESSAGE_PATTERN: "%{message}"
    cmds:
      - '"{{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"'

  deploy:
    label: "app:deploy:{{.BUILD_TYPE}}"
    desc: Deploy the application
    vars:
      BUILD_TYPE: '{{default "Release" .BUILD_TYPE}}'
      BUILD_DIR: "{{.BUILD_ROOT}}/{{.BUILD_TYPE}}"
      DEPLOY_DIR: "{{.BUILD_ROOT}}/deploy/{{.BUILD_TYPE}}"
      APP_BUNDLE: "{{.DEPLOY_DIR}}/{{.APP_NAME}}.app"
    deps:
      - task: build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    env:
      CRAFTWARD_SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    preconditions:
      - sh: command -v codesign
        msg: codesign is not available in PATH
      - sh: command -v hdiutil
        msg: hdiutil is not available in PATH
    cmds:
      - cmake -E remove_directory "{{.DEPLOY_DIR}}"
      - ditto "{{.BUILD_DIR}}/{{.APP_NAME}}.app" "{{.APP_BUNDLE}}"
      - >-
        cmake --install "{{.BUILD_DIR}}/{{.HOST_ARCH}}"
        --prefix "{{.DEPLOY_DIR}}"
        --config "{{.BUILD_TYPE}}"
        --component RuntimeDependencies
      - >-
        bash macos/finalize-deployment.sh
        "{{.APP_BUNDLE}}"
        "{{.DEPLOY_DIR}}"
        macos/Entitlements.plist
