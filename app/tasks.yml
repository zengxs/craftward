version: "3"

vars:
  APP_NAME: Craftward
  SIGN_IDENTITY: '{{default "-" .SIGN_IDENTITY}}'

tasks:
  clean:
    desc: Remove all application build artifacts
    cmds:
      - rm -rf build

  format:qml:
    desc: Format QML files
    internal: true
    requires:
      vars: [QT6_ROOT]
    preconditions:
      - sh: test -x "$QT6_ROOT/bin/qmlformat"
        msg: qmlformat was not found under QT6_ROOT
    cmds:
      - >-
        git ls-files -z
        --cached
        --others
        --exclude-standard
        --no-recurse-submodules
        --
        ":(glob)qml/**/*.qml"
        ":(glob)tests/**/*.qml"
        | xargs -0 sh -c
        'formatter=$1; shift; for path do test ! -f "$path" || "$formatter" -i "$path" || exit; done'
        sh "$QT6_ROOT/bin/qmlformat"

  test:
    desc: Run all application regression tests
    cmds:
      - task: test:qml
      - task: test:cpp

  test:qml:
    desc: Run QML regression tests
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
    requires:
      vars: [QT6_ROOT]
    deps:
      - task: configure
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          BUILD_TESTING: "ON"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    preconditions:
      - sh: test -x "$QT6_ROOT/bin/qmltestrunner"
        msg: qmltestrunner was not found under QT6_ROOT
    env:
      QT_QPA_PLATFORM: offscreen
    cmds:
      - 'cmake --build "{{.BUILD_DIR}}" --target release_translations --parallel'
      - >-
        "$QT6_ROOT/bin/qmltestrunner"
        -import tests/qml/imports
        -translation "{{.BUILD_DIR}}/craftward_en.qm"
        -input tests/qml

  test:cpp:
    desc: Build and run C++ regression tests
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
    deps:
      - task: :core:build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
      - task: configure
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          BUILD_TESTING: "ON"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - >-
        cmake --build "{{.BUILD_DIR}}"
        --target
        CraftwardApplicationControllerTest
        CraftwardCoreFfiSupportTest
        CraftwardCodexHistoryControllerTest
        CraftwardCodexTimelinePresentationModelTest
        CraftwardCodexTimelineViewportIntegrationTest
        CraftwardCodexTimelineViewportModelTest
        CraftwardLocalizationControllerTest
        CraftwardMarkupDocumentModelTest
        CraftwardRealmControllerTest
        CraftwardSyntaxHighlightingTest
        --parallel
      - >-
        ctest --test-dir "{{.BUILD_DIR}}"
        --output-on-failure
        -R '^Craftward(ApplicationController|CoreFfiSupport|CodexHistoryController|CodexTimelinePresentationModel|CodexTimelineViewportIntegration|CodexTimelineViewportModel|LocalizationController|MarkupDocumentModel|RealmController|SyntaxHighlighting)Test$'

  configure:
    label: "app:configure:{{.BUILD_TYPE}}:testing={{.BUILD_TESTING}}"
    desc: Configure the application build
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
      BUILD_TESTING: '{{default "OFF" .BUILD_TESTING}}'
    requires:
      vars: [QT6_ROOT]
    deps:
      - task: :xtask:bindings:check
      - task: :xtask:version:check
      - task: :xtask:licenses:generate
        vars:
          OUTPUT_DIR: "app/{{.BUILD_DIR}}/generated/legal"
    env:
      CRAFTWARD_SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - >-
        cmake -S .
        -B "{{.BUILD_DIR}}"
        -G Ninja
        -DCMAKE_BUILD_TYPE="{{.BUILD_TYPE}}"
        -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        -DCMAKE_OSX_DEPLOYMENT_TARGET="{{.MACOS_DEPLOYMENT_TARGET}}"
        -DBUILD_TESTING="{{.BUILD_TESTING}}"
        -DQt6_ROOT="$QT6_ROOT"
        -DCRAFTWARD_SIGN_IDENTITY="$CRAFTWARD_SIGN_IDENTITY"

  build:
    label: "app:build:{{.BUILD_TYPE}}"
    desc: Build the application
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
    deps:
      - task: :core:build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
      - task: configure
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - cmake --build "{{.BUILD_DIR}}" --parallel

  run:
    label: "app:run:{{.BUILD_TYPE}}"
    desc: Run the application
    vars:
      BUILD_TYPE: '{{default "Debug" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
    deps:
      - task: build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    cmds:
      - ./{{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}

  benchmark:timeline-render:
    label: "app:benchmark:timeline-render:{{.BUILD_TYPE}}"
    desc: Benchmark timeline rendering against a persisted Codex conversation
    vars:
      BUILD_TYPE: '{{default "Release" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
      RENDERER: '{{default "current" .RENDERER}}'
    requires:
      vars: [QT6_ROOT, THREAD_ID]
    deps:
      - task: build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    env:
      CRAFTWARD_FRAME_TIMING_OVERLAY: "0"
      CRAFTWARD_TIMELINE_RENDER_BENCHMARK_RENDERER: "{{.RENDERER}}"
      CRAFTWARD_TIMELINE_RENDER_BENCHMARK_THREAD: "{{.THREAD_ID}}"
      QT_MESSAGE_PATTERN: "%{message}"
    cmds:
      - ./{{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}

  deploy:
    label: "app:deploy:{{.BUILD_TYPE}}"
    desc: Deploy the application
    vars:
      BUILD_TYPE: '{{default "Release" .BUILD_TYPE}}'
      BUILD_DIR: "build/{{.BUILD_TYPE}}"
      DEPLOY_DIR: "build/deploy/{{.BUILD_TYPE}}"
      APP_BUNDLE: "{{.DEPLOY_DIR}}/{{.APP_NAME}}.app"
    deps:
      - task: build
        vars:
          BUILD_TYPE: "{{.BUILD_TYPE}}"
          SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    env:
      CRAFTWARD_SIGN_IDENTITY: "{{.SIGN_IDENTITY}}"
    preconditions:
      - sh: command -v codesign
        msg: codesign is not available in PATH
      - sh: command -v hdiutil
        msg: hdiutil is not available in PATH
    cmds:
      - cmake -E remove_directory "{{.DEPLOY_DIR}}"
      - >-
        cmake --install "{{.BUILD_DIR}}"
        --prefix "{{.DEPLOY_DIR}}"
        --config "{{.BUILD_TYPE}}"
      - >-
        bash macos/finalize-deployment.sh
        "{{.APP_BUNDLE}}"
        "{{.DEPLOY_DIR}}"
        macos/Entitlements.plist
