version: "3"

tasks:
  test:
    desc: Run repository tooling tests and validation
    preconditions:
      - sh: command -v cargo
        msg: cargo is not available in PATH
    cmds:
      - cargo test --all-targets --locked
      - task: licenses:check

  format:cargo:
    desc: Format Cargo files
    internal: true
    cmds:
      - cargo fmt

  version:sync:
    desc: Synchronize product versions from version.toml
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo run --manifest-path xtask/Cargo.toml --locked -- version sync

  version:check:
    desc: Check synchronized product versions
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo run --manifest-path xtask/Cargo.toml --locked -- version check

  licenses:fetch:
    desc: Fetch pinned third-party license texts
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo run --manifest-path xtask/Cargo.toml --locked -- licenses fetch

  licenses:generate:
    desc: Generate application legal resources without network access
    dir: "{{.ROOT_DIR}}"
    vars:
      OUTPUT_DIR: '{{default "app/build/generated/legal" .OUTPUT_DIR}}'
    cmds:
      - >-
        cargo run --manifest-path xtask/Cargo.toml --locked --
        licenses generate --output "{{.OUTPUT_DIR}}"

  licenses:check:
    desc: Validate application and third-party license sources
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo run --manifest-path xtask/Cargo.toml --locked -- licenses check
