[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
cbindgen = { version = "0.29", default-features = false }
clap = { version = "4", features = ["derive"] }
csscolorparser = { version = "0.8", default-features = false, features = ["std"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
ureq = "3"
