name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Rust workspace
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          lfs: 'true'

      - name: Install build dependencies
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust workspace
        working-directory: core
        run: cargo test --workspace --all-targets --locked

  build:
    name: Build universal DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          lfs: 'true'

      - name: Install build dependencies
        run: brew install aqtinstall cmake ninja go-task protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Qt
        run: |
          aqt install-qt \
            --outputdir "$HOME/Library/Qt" \
            mac desktop 6.11.1 clang_64 \
            -m qtgrpc qtimageformats
          echo "QT6_ROOT=$HOME/Library/Qt/6.11.1/macos" >> "$GITHUB_ENV"

      - name: Build and package
        run: task app:deploy BUILD_TYPE=Release SIGN_IDENTITY=-

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          path: app/build/deploy/Release/*.dmg
          archive: false
          if-no-files-found: error
