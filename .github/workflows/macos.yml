name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: brew install aqtinstall cmake ninja go-task

      - name: Install Qt
        run: |
          aqt install-qt \
            --outputdir "$HOME/Library/Qt" \
            mac desktop 6.11.1 clang_64 \
            -m qtimageformats
          echo "QT6_ROOT=$HOME/Library/Qt/6.11.1/macos" >> "$GITHUB_ENV"

      - name: Build and package
        run: task app:deploy BUILD_TYPE=Release SIGN_IDENTITY=-

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          path: app/build/deploy/Release/*.dmg
          archive: false
          if-no-files-found: error
