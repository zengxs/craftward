name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          lfs: 'true'

      - name: Install build dependencies
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check synchronized product version
        run: cargo run --manifest-path xtask/Cargo.toml --locked -- version check

      - name: Test core
        working-directory: core
        run: cargo test --workspace --all-targets --locked

      - name: Test xtask
        run: |
          cargo test --manifest-path xtask/Cargo.toml --all-targets --locked
          cargo run --manifest-path xtask/Cargo.toml --locked -- licenses check

  build:
    name: Build universal DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          lfs: 'true'

      - name: Install build dependencies
        run: brew install aqtinstall cmake ninja go-task protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install sccache
        if: >-
          github.event_name != 'workflow_dispatch' &&
          github.event_name != 'release' &&
          !startsWith(github.ref, 'refs/tags/')
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.17.0'

      - name: Enable sccache
        if: >-
          github.event_name != 'workflow_dispatch' &&
          github.event_name != 'release' &&
          !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_MULTIARCH=1" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_OBJC_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_OBJCXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Install Qt
        run: |
          aqt install-qt \
            --outputdir "$HOME/Library/Qt" \
            mac desktop 6.11.1 clang_64 \
            -m qtgrpc qtimageformats qttasktree
          echo "QT6_ROOT=$HOME/Library/Qt/6.11.1/macos" >> "$GITHUB_ENV"

      - name: Build and package
        run: task app:deploy BUILD_TYPE=Release SIGN_IDENTITY=-

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          path: app/build/deploy/Release/*.dmg
          archive: false
          if-no-files-found: error
