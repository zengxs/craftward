version: "3"

dotenv: [.env]

vars:
  MACOS_DEPLOYMENT_TARGET: "13.0"

includes:
  core:
    taskfile: ./core/tasks.yml
    dir: ./core

  app:
    taskfile: ./app/tasks.yml
    dir: ./app

tasks:
  default:
    silent: true
    desc: List all available tasks
    cmds:
      - task --list-all --sort none

  format:
    desc: Format source code
    cmds:
      - task: format:clang
      - task: core:format:cargo
      - task: format:xtask
      - task: app:format:qml

  format:xtask:
    desc: Format xtask Rust source code
    internal: true
    cmds:
      - cargo fmt --manifest-path xtask/Cargo.toml

  format:clang:
    desc: Format source code with clang-format
    internal: true
    preconditions:
      - sh: command -v clang-format
        msg: clang-format is not available in PATH
    cmds:
      - >-
        git ls-files -z
        --cached
        --others
        --exclude-standard
        --no-recurse-submodules
        --
        "*.c" "*.cc" "*.cpp" "*.cxx"
        "*.h" "*.hh" "*.hpp" "*.hxx"
        "*.m" "*.mm"
        "*.proto"
        | xargs -0 sh -c
        'for path do test ! -f "$path" || clang-format -i "$path" || exit; done'
        sh

  licenses:fetch:
    desc: Fetch pinned third-party license texts
    cmds:
      - cargo run --manifest-path xtask/Cargo.toml --locked -- licenses fetch

  licenses:generate:
    desc: Generate application legal resources without network access
    vars:
      OUTPUT_DIR: '{{default "app/build/generated/legal" .OUTPUT_DIR}}'
    cmds:
      - >-
        cargo run --manifest-path xtask/Cargo.toml --locked --
        licenses generate --output "{{.OUTPUT_DIR}}"

  licenses:check:
    desc: Validate application and third-party license sources
    cmds:
      - cargo run --manifest-path xtask/Cargo.toml --locked -- licenses check
