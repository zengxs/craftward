version: "3"

dotenv: [.env]

vars:
  MACOS_DEPLOYMENT_TARGET: "13.0"

includes:
  core:
    taskfile: ./core/tasks.yml
    dir: ./core

  app:
    taskfile: ./app/tasks.yml
    dir: ./app

  xtask:
    taskfile: ./xtask/tasks.yml
    dir: ./xtask

tasks:
  default:
    silent: true
    desc: List all available tasks
    cmds:
      - task --list-all --sort none

  test:
    desc: Run all automated tests
    cmds:
      - task: core:test
      - task: xtask:test
      - task: app:test

  format:
    desc: Format source code
    cmds:
      - task: xtask:version:sync
      - task: format:clang
      - task: core:format:cargo
      - task: app:format:qml
      - task: xtask:format:cargo

  format:clang:
    desc: Format source code with clang-format
    internal: true
    preconditions:
      - sh: command -v clang-format
        msg: clang-format is not available in PATH
    cmds:
      - >-
        git ls-files -z
        --cached
        --others
        --exclude-standard
        --no-recurse-submodules
        --
        "*.c" "*.cc" "*.cpp" "*.cxx"
        "*.h" "*.hh" "*.hpp" "*.hxx"
        "*.m" "*.mm"
        "*.proto"
        | xargs -0 sh -c
        'for path do test ! -f "$path" || clang-format -i "$path" || exit; done'
        sh
