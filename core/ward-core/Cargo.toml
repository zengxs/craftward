[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
app = ["dep:ward-markup"]

[dependencies]
blake3 = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ward-cli = { workspace = true }
ward-codex = { workspace = true }
ward-markup = { workspace = true, optional = true }
ward-realm = { workspace = true }
ward-realm-vz = { workspace = true }
ward-runtime = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
ward-codex-test-support = { workspace = true }
