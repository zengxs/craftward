language = "C"
cpp_compat = true
include_guard = "WARD_CORE_H"
header = """
// Copyright (C) 2026 Xiangsong Zeng
// SPDX-License-Identifier: GPL-3.0-or-later

// clang-format off
"""
trailer = "// clang-format on"
autogen_warning = "/* Generated by `task xtask:bindings:generate`. Do not edit manually. */"
include_version = true
documentation = true
documentation_style = "c99"
documentation_length = "full"
style = "both"
usize_is_size_t = true
line_length = 120
tab_width = 4

# Rust functions marked with `#[unsafe(no_mangle)]` define the export boundary.
# cbindgen's `export.include` is intentionally unused because it adds otherwise
# unreachable items instead of restricting generated functions.
[export]
item_types = ["enums", "structs", "typedefs", "opaque", "functions"]

[fn]
rename_args = "None"
sort_by = "Name"

[struct]
rename_fields = "None"

[enum]
rename_variants = "PascalCase"
prefix_with_name = true

[parse]
parse_deps = false
