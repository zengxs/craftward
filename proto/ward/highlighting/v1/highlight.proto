syntax = "proto3";

package ward.highlighting.v1;

// One RGBA color with eight-bit channels.
message Color {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
  uint32 alpha = 4;
}

// The visual style resolved from a syntax scope and theme.
message Style {
  Color foreground = 1;
  Color background = 2;
  bool bold = 3;
  bool italic = 4;
  bool underline = 5;
}

// One styled UTF-8 byte range in the original source.
message Span {
  uint64 utf8_start = 1;
  uint64 utf8_end = 2;
  Style style = 3;
}

// A source snapshot highlighted independently of any rendering toolkit.
message HighlightedCode {
  string syntax_name = 1;
  repeated Span spans = 2;
  // True when the supplied language token matched a maintained syntax.
  bool language_recognized = 3;
}

// Configuration for one worker-affine editor document.
message DocumentConfiguration {
  string language = 1;
  string file_name = 2;
  bool dark_theme = 3;
}

// An ordered change using byte positions in the previous text revision.
message DocumentEdit {
  uint64 from_revision = 1;
  uint64 start = 2;
  uint64 deleted = 3;
  bytes inserted = 4;
}

// A replacement range. Unspecified bytes inside the range use the default
// style.
message DocumentStyles {
  uint64 revision = 1;
  uint64 configuration = 2;
  uint64 sequence = 3;
  uint64 start = 4;
  uint64 end = 5;
  repeated Span spans = 6;
  string syntax_name = 7;
  bool language_recognized = 8;
  bool complete = 9;
}
