syntax = "proto3";

package ward.codex.v1;

// A page of persisted Codex thread summaries.
message ThreadPage {
  repeated ThreadSummary threads = 1;
  optional string next_cursor = 2;
}

// The metadata needed to present one persisted Codex thread.
message ThreadSummary {
  string thread_id = 1;
  optional string name = 2;
  string preview = 3;
  string working_directory = 4;
  int64 created_at_unix_seconds = 5;
  int64 updated_at_unix_seconds = 6;
}

// The complete visible model catalog advertised by Codex.
message ModelCatalog {
  repeated ModelInfo models = 1;
}

// One model available for Codex conversations and turns.
message ModelInfo {
  string model_id = 1;
  string model = 2;
  string display_name = 3;
  string description = 4;
  bool is_default = 5;
  string default_reasoning_effort = 6;
  repeated ReasoningEffortOption supported_reasoning_efforts = 7;
}

// One reasoning-effort choice supported by a model.
message ReasoningEffortOption {
  string reasoning_effort = 1;
  string description = 2;
}

// The displayable content of one persisted Codex thread.
message Conversation {
  string title = 1;
  reserved 2, 3;

  // Persisted Codex turns do not retain every runtime interaction.
  bool activity_history_is_partial = 4;

  // Displayable thread items in their original turn order.
  repeated TimelineItem timeline = 5;

  // Terminal turn identifiers confirmed by an authoritative persisted snapshot.
  repeated string forkable_turn_ids = 6;

  // Best-effort execution evidence derived from the latest persisted turn.
  PersistedRunState persisted_run_state = 7;

  // Timing retained for turns that expose reliable app-server metadata.
  repeated TurnTiming turn_timings = 8;
}

message TurnTiming {
  string turn_id = 1;
  optional int64 started_at_unix_seconds = 2;
  optional int64 completed_at_unix_seconds = 3;

  // Prefer the app-server duration; otherwise this may be derived from the
  // available second-resolution endpoints.
  optional int64 duration_milliseconds = 4;
}

// The execution status inferred from a persisted conversation snapshot.
// This is not authoritative live state and may lag behind another app-server.
enum PersistedRunStatus {
  PERSISTED_RUN_STATUS_UNSPECIFIED = 0;
  PERSISTED_RUN_STATUS_NOT_RUNNING = 1;
  PERSISTED_RUN_STATUS_IN_PROGRESS = 2;
  PERSISTED_RUN_STATUS_UNKNOWN = 3;
}

message PersistedRunState {
  PersistedRunStatus status = 1;
  optional string turn_id = 2;
}

enum HistoryEventKind {
  HISTORY_EVENT_KIND_UNSPECIFIED = 0;
  HISTORY_EVENT_KIND_THREADS_UPDATED = 1;
  HISTORY_EVENT_KIND_CONVERSATION_UPDATED = 2;
  HISTORY_EVENT_KIND_THREADS_RECOVERED = 3;
  HISTORY_EVENT_KIND_CONVERSATION_RECOVERED = 4;
  HISTORY_EVENT_KIND_THREADS_ERROR = 5;
  HISTORY_EVENT_KIND_CONVERSATION_ERROR = 6;
  HISTORY_EVENT_KIND_TURN_STARTED = 7;
  HISTORY_EVENT_KIND_TURN_COMPLETED = 8;
  HISTORY_EVENT_KIND_TURN_ERROR = 9;
  HISTORY_EVENT_KIND_TURN_NOTICE = 10;
  HISTORY_EVENT_KIND_THREAD_WRITE_STATE_CHANGED = 11;
  HISTORY_EVENT_KIND_THREAD_RUNTIME_STATE_CHANGED = 12;
  HISTORY_EVENT_KIND_PENDING_INTERACTIONS_UPDATED = 13;
  // Carries the new thread identifier and its initial Conversation.
  HISTORY_EVENT_KIND_THREAD_STARTED = 14;
  // Carries an error_message without a thread identifier.
  HISTORY_EVENT_KIND_THREAD_START_ERROR = 15;
  // Confirms that guidance was accepted for the selected active turn.
  HISTORY_EVENT_KIND_TURN_STEERED = 16;
  // Carries an error_message when guidance was not accepted.
  HISTORY_EVENT_KIND_TURN_STEER_ERROR = 17;
  // Carries an error_message when a thread could not be archived or restored.
  HISTORY_EVENT_KIND_THREAD_LIFECYCLE_ERROR = 18;
  // Carries the new thread identifier and its complete forked Conversation.
  HISTORY_EVENT_KIND_THREAD_FORKED = 19;
  // Carries an error_message for the source thread when it could not be forked.
  HISTORY_EVENT_KIND_THREAD_FORK_ERROR = 20;
  // Carries the complete visible model catalog.
  HISTORY_EVENT_KIND_MODEL_CATALOG_UPDATED = 21;
  // Carries an error_message when the model catalog could not be loaded.
  HISTORY_EVENT_KIND_MODEL_CATALOG_ERROR = 22;
  // Carries the active inference options reported for one writable thread.
  HISTORY_EVENT_KIND_THREAD_MODEL_CHANGED = 23;
}

// The selected thread's writer availability for this Craftward observer.
enum ThreadWriteStatus {
  THREAD_WRITE_STATUS_UNSPECIFIED = 0;
  THREAD_WRITE_STATUS_IDLE = 1;
  THREAD_WRITE_STATUS_CHECKING = 2;
  THREAD_WRITE_STATUS_WRITABLE = 3;
  THREAD_WRITE_STATUS_BUSY = 4;
  THREAD_WRITE_STATUS_UNAVAILABLE = 5;
}

message ThreadWriteState {
  ThreadWriteStatus status = 1;
  optional string message = 2;
}

// Runtime state observed on the app-server connection subscribed to a thread.
enum ThreadRuntimeStatus {
  THREAD_RUNTIME_STATUS_UNSPECIFIED = 0;
  THREAD_RUNTIME_STATUS_DETACHED = 1;
  THREAD_RUNTIME_STATUS_STARTING = 2;
  THREAD_RUNTIME_STATUS_IDLE = 3;
  THREAD_RUNTIME_STATUS_ACTIVE = 4;
  THREAD_RUNTIME_STATUS_SYSTEM_ERROR = 5;
  THREAD_RUNTIME_STATUS_UNKNOWN = 6;
}

enum ThreadActiveFlag {
  THREAD_ACTIVE_FLAG_UNSPECIFIED = 0;
  THREAD_ACTIVE_FLAG_WAITING_ON_APPROVAL = 1;
  THREAD_ACTIVE_FLAG_WAITING_ON_USER_INPUT = 2;
  THREAD_ACTIVE_FLAG_UNKNOWN = 3;
}

message ThreadRuntimeState {
  ThreadRuntimeStatus status = 1;
  optional string turn_id = 2;
  repeated ThreadActiveFlag active_flags = 3;
}

// The inference options currently associated with one Codex thread writer.
message ThreadModelState {
  string model = 1;
  optional string reasoning_effort = 2;
}

// One event emitted by a Codex app-server observer.
message HistoryEvent {
  HistoryEventKind kind = 1;
  optional string thread_id = 2;
  // The active/archived scope for every thread-list event.
  optional bool archived = 9;

  oneof body {
    ThreadPage thread_page = 3;
    Conversation conversation = 4;
    string error_message = 5;
    ThreadWriteState thread_write_state = 6;
    ThreadRuntimeState thread_runtime_state = 7;
    PendingInteractionPage pending_interactions = 8;
    ModelCatalog model_catalog = 10;
    ThreadModelState thread_model_state = 11;
  }
}

enum PendingInteractionKind {
  PENDING_INTERACTION_KIND_UNSPECIFIED = 0;
  PENDING_INTERACTION_KIND_COMMAND_APPROVAL = 1;
  PENDING_INTERACTION_KIND_FILE_CHANGE_APPROVAL = 2;
  PENDING_INTERACTION_KIND_USER_INPUT = 3;
}

enum PendingInteractionDecision {
  PENDING_INTERACTION_DECISION_UNSPECIFIED = 0;
  PENDING_INTERACTION_DECISION_ACCEPT = 1;
  PENDING_INTERACTION_DECISION_ACCEPT_FOR_SESSION = 2;
  PENDING_INTERACTION_DECISION_DECLINE = 3;
  PENDING_INTERACTION_DECISION_CANCEL = 4;
}

message PendingInteractionOption {
  string label = 1;
  string description = 2;
}

message PendingInteractionQuestion {
  string question_id = 1;
  string header = 2;
  string prompt = 3;
  repeated PendingInteractionOption options = 4;
  bool allows_other = 5;
  bool secret = 6;
}

// One app-server request awaiting a response from the Craftward user.
message PendingInteraction {
  // Opaque identifier assigned by Craftward. This is not the JSON-RPC request
  // identifier used by the app-server transport.
  uint64 interaction_id = 1;
  string thread_id = 2;
  optional string turn_id = 3;
  optional string item_id = 4;
  PendingInteractionKind kind = 5;
  optional string command = 6;
  optional string working_directory = 7;
  optional string reason = 8;
  optional string grant_root = 9;
  repeated PendingInteractionDecision available_decisions = 10;
  repeated PendingInteractionQuestion questions = 11;
  bool user_input_is_blocking = 12;
}

message PendingInteractionPage {
  repeated PendingInteraction interactions = 1;
}

message PendingInteractionAnswer {
  string question_id = 1;
  repeated string answers = 2;
}

message PendingUserInputResponse {
  repeated PendingInteractionAnswer answers = 1;
}

// A structured response sent from the UI back to Ward Core.
message PendingInteractionResponse {
  uint64 interaction_id = 1;

  oneof body {
    PendingInteractionDecision decision = 2;
    PendingUserInputResponse user_input = 3;
  }
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_AGENT = 2;
}

enum MessagePhase {
  MESSAGE_PHASE_UNSPECIFIED = 0;
  MESSAGE_PHASE_COMMENTARY = 1;
  MESSAGE_PHASE_FINAL_ANSWER = 2;
  MESSAGE_PHASE_OTHER = 3;
}

// One normalized user or agent message.
message Message {
  // Stable identifier inherited from the source thread item.
  string message_id = 1;
  MessageRole role = 2;
  MessagePhase phase = 3;
  string text = 4;
}

// One displayable item at its original position in a Codex turn.
message TimelineItem {
  string turn_id = 1;

  oneof body {
    Message message = 2;
    Activity activity = 3;
  }
}

enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  ACTIVITY_KIND_PLAN = 1;
  reserved 2;
  ACTIVITY_KIND_COMMAND_EXECUTION = 3;
  ACTIVITY_KIND_FILE_CHANGE = 4;
  ACTIVITY_KIND_TOOL_CALL = 5;
  ACTIVITY_KIND_COLLABORATION = 6;
  ACTIVITY_KIND_WEB_SEARCH = 7;
  ACTIVITY_KIND_IMAGE_VIEW = 8;
  ACTIVITY_KIND_WAIT = 9;
  ACTIVITY_KIND_IMAGE_GENERATION = 10;
  ACTIVITY_KIND_REVIEW_STARTED = 11;
  ACTIVITY_KIND_REVIEW_COMPLETED = 12;
  ACTIVITY_KIND_CONTEXT_COMPACTION = 13;
  ACTIVITY_KIND_REASONING = 14;
}

enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  ACTIVITY_STATUS_IN_PROGRESS = 1;
  ACTIVITY_STATUS_COMPLETED = 2;
  ACTIVITY_STATUS_FAILED = 3;
  ACTIVITY_STATUS_DECLINED = 4;
  ACTIVITY_STATUS_OTHER = 5;
}

enum CommandActionKind {
  COMMAND_ACTION_KIND_UNSPECIFIED = 0;
  COMMAND_ACTION_KIND_READ = 1;
  COMMAND_ACTION_KIND_LIST_FILES = 2;
  COMMAND_ACTION_KIND_SEARCH = 3;
  COMMAND_ACTION_KIND_OTHER = 4;
}

// One semantic action parsed from a command by Codex.
message CommandAction {
  CommandActionKind kind = 1;
  string command = 2;
  optional string name = 3;
  optional string path = 4;
  optional string query = 5;
}

// One folded activity item retained in persisted Codex history.
message Activity {
  string activity_id = 1;
  reserved 2;
  ActivityKind kind = 3;
  ActivityStatus status = 4;
  string summary = 5;
  optional string detail = 6;
  optional string context = 7;
  repeated CommandAction command_actions = 8;
  optional int64 started_at_unix_milliseconds = 9;
  optional int64 completed_at_unix_milliseconds = 10;
}
